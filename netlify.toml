[build]
  command = "npm run build"
  publish = "dist"

# Hemmeligheter ligger kun i Netlify UI + lokal .env (aldri i Git).
# Gratis plan kan ikke velge «kun Functions» — skanner stopper deploy om token er i bygg-miljø.
# Da skrur vi av repo-skann (nøkler er fortsatt trygge; .env er gitignored).
[build.environment]
  SECRETS_SCAN_ENABLED = "false"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    # Tving HTTPS i nettleseren i minst ett år (uten preload — preload krever egen søknad hos Google)
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # JSON-LD i index.html krever 'unsafe-inline' for script. Eventuelle lokale sider under /intern/ (gitignored) kan ha innebygd CSS.
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://*.ingest.sentry.io https://*.ingest.de.sentry.io; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

[functions]
  directory = "netlify/functions"

# Lokal utvikling: Netlify Dev kjører Vite + serverless-funksjoner (Telegram) sammen
[dev]
  command = "npm run dev"
  targetPort = 5173

# API før SPA-fallback — ellers fanget av index.html
[[redirects]]
  from = "/api/order"
  to = "/.netlify/functions/order"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
